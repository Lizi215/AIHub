server:
  port: ${GATEWAY_PORT:8080}

spring:
  application:
    name: aihub-gateway
  data:
    redis:
      # 注销黑名单校验依赖 Redis，且每条请求都会查，因此必须用 reactive 客户端
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      timeout: 3000ms
  cloud:
    nacos:
      discovery:
        # 本地无 Nacos 时置 false 即可启动（配合 spring.cloud.discovery.client.simple.instances 使用）
        enabled: ${NACOS_ENABLED:true}
        server-addr: ${NACOS_ADDR:127.0.0.1:8848}
    gateway:
      routes:
        # Phase 0 探测入口：任一业务服务提供 /api/v1/ping，经此路由转发
        - id: aihub-user
          uri: lb://aihub-user
          predicates:
            - Path=/api/v1/ping,/api/v1/auth/**,/api/v1/users/**,/api/v1/workspaces/**
        - id: aihub-asset
          uri: lb://aihub-asset
          predicates:
            - Path=/api/v1/assets,/api/v1/assets/**
        - id: aihub-community
          uri: lb://aihub-community
          predicates:
            - Path=/api/v1/posts,/api/v1/posts/**,/api/v1/issues,/api/v1/issues/**
        # Agent 接口。刻意不加入 AuthGlobalFilter 的公开规则表：
        # /api/** 中未命中公开规则的一律要求登录，因此 /api/v1/agent/** 天然需要 JWT。
        - id: aihub-ai
          uri: lb://aihub-ai
          predicates:
            - Path=/api/v1/agent/**
        # 搜索接口。读取公开（Visitor 也能搜），已在 AuthGlobalFilter 的公开规则表里放行 GET。
        - id: aihub-search
          uri: lb://aihub-search
          predicates:
            - Path=/api/v1/search/**
      # 说明：/internal/**（含 Agent 用的内部只读查询接口）是服务间接口，
      # 刻意不配置路由，因此不会暴露到公网

aihub:
  jwt:
    # 与业务服务共用同一密钥；缺失则启动失败（禁止默认密钥）
    secret: ${JWT_SECRET:}
    issuer: ${JWT_ISSUER:aihub}
    access-token-ttl: ${JWT_ACCESS_TTL:30m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
  gateway:
    cors:
      allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

management:
  endpoints:
    web:
      exposure:
        include: health,info

apollo:
  bootstrap:
    enabled: ${APOLLO_ENABLED:true}
    namespaces: application
  meta: ${APOLLO_META:http://127.0.0.1:8090}

app:
  id: aihub-gateway
