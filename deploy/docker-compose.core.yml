# AIHub 最小可运行中间件集（MySQL / Redis / MinIO）
#
# 【镜像 tag 说明】
# 搭建本文件时所在环境无法访问 Docker Hub（registry 不可达），因此下列 tag 是按版本线
# 选取的常规 tag，未经过实际 pull 验证。
# 首次启动前请先执行 `docker compose -f deploy/docker-compose.core.yml pull`，
# 若某个 tag 不存在，请改成同一版本线下的可用 tag 后再启动。禁止改用 latest。
#
# 用法（在 deploy 目录下）：
#   docker compose -f docker-compose.core.yml up -d
name: aihub-core

services:
  mysql:
    image: mysql:8.4
    container_name: aihub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置，请先配置 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aihub}
      MYSQL_USER: ${MYSQL_USER:-aihub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置，请先配置 .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      # utf8mb4 必须显式指定，否则昵称中的 emoji 会直接报错（docs/DATA.md §2）
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      # 与服务器时区保持一致，禁止依赖 JVM 默认时区；用偏移量可免加载时区表
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - aihub-mysql-data:/var/lib/mysql
      # 初始化脚本目录，首个 Admin 账号由 sql/ 下的脚本写入（docs/ARCHITECTURE.md §9.3）
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: aihub-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请先配置 .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aihub-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: aihub-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 未设置，请先配置 .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，请先配置 .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - aihub-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  aihub-mysql-data:
  aihub-redis-data:
  aihub-minio-data:
