# AIHub 完整中间件（core + Nacos / Apollo / Sentinel Dashboard / Elasticsearch / RocketMQ）
#
# 【镜像 tag 说明】同 docker-compose.core.yml 顶部注释：tag 未经实际 pull 验证，
# 首次启动前请先 `docker compose -f deploy/docker-compose.full.yml pull`。
#
# 【资源要求】全量中间件约需 8GB 内存，Docker Desktop 默认的 8GB 分配会启动失败，
# 请先把内存配额调到 10GB 以上（docs/SECURITY.md §5）。
#
# 用法（在 deploy 目录下）：
#   docker compose -f docker-compose.full.yml up -d
name: aihub-full

services:
  mysql:
    image: mysql:8.4
    container_name: aihub-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD 未设置，请先配置 .env}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-aihub}
      MYSQL_USER: ${MYSQL_USER:-aihub}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?MYSQL_PASSWORD 未设置，请先配置 .env}
      TZ: ${TZ:-Asia/Shanghai}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+08:00
    ports:
      - "${MYSQL_PORT:-3306}:3306"
    volumes:
      - aihub-mysql-data:/var/lib/mysql
      - ../sql:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7.4-alpine
    container_name: aihub-redis
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD 未设置，请先配置 .env}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - aihub-redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping | grep PONG"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio:
    image: minio/minio:RELEASE.2024-06-13T22-53-53Z
    container_name: aihub-minio
    restart: unless-stopped
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?MINIO_ROOT_USER 未设置，请先配置 .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?MINIO_ROOT_PASSWORD 未设置，请先配置 .env}
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - aihub-minio-data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9000/minio/health/live || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Nacos 只承担注册中心职责；配置中心是 Apollo
  nacos:
    image: nacos/nacos-server:v3.0.3
    container_name: aihub-nacos
    restart: unless-stopped
    environment:
      MODE: standalone
      NACOS_AUTH_ENABLE: "false"
      JVM_XMS: 512m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "${NACOS_PORT:-8848}:8848"
      - "${NACOS_GRPC_PORT:-9848}:9848"
    volumes:
      - aihub-nacos-data:/home/nacos/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8848/nacos/v1/console/health/readiness || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Apollo quick start：单容器内含 config / admin / portal 与内置 MySQL，符合「单机最小配置」
  # 宿主机端口映射到 8090，避免与 Gateway 的 8080 冲突；APOLLO_META 默认值与此对应
  apollo:
    image: apolloconfig/apollo-quick-start:2.5.0
    container_name: aihub-apollo
    restart: unless-stopped
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      - "${APOLLO_PORT:-8090}:8080"
      - "${APOLLO_PORTAL_PORT:-8070}:8070"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8080/services/config || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 90s

  # Sentinel Dashboard：规则最终持久化到 Nacos，禁止只依赖 Dashboard 内存规则（docs/BACKEND.md §3）
  sentinel-dashboard:
    image: bladex/sentinel-dashboard:1.8.9
    container_name: aihub-sentinel-dashboard
    restart: unless-stopped
    environment:
      JAVA_OPTS: "-Dserver.port=8858 -Dcsp.sentinel.dashboard.server=localhost:8858 -Dproject.name=sentinel-dashboard"
    ports:
      - "${SENTINEL_DASHBOARD_PORT:-8858}:8858"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8858/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # ES 9.x 单节点；唯一出口是 Search Service（Phase 3）
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.0.0
    container_name: aihub-elasticsearch
    restart: unless-stopped
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
      TZ: ${TZ:-Asia/Shanghai}
    ulimits:
      memlock:
        soft: -1
        hard: -1
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - aihub-es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:9200/_cluster/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 30
      start_period: 90s

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.1
    container_name: aihub-rocketmq-namesrv
    restart: unless-stopped
    command: sh mqnamesrv
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    ports:
      - "${ROCKETMQ_NAMESRV_PORT:-9876}:9876"

  # 单 master 无 slave
  rocketmq-broker:
    image: apache/rocketmq:5.3.1
    container_name: aihub-rocketmq-broker
    restart: unless-stopped
    depends_on:
      - rocketmq-namesrv
    command: sh mqbroker -n rocketmq-namesrv:9876 --enable-proxy
    environment:
      NAMESRV_ADDR: rocketmq-namesrv:9876
      JAVA_OPT_EXT: "-Xms512m -Xmx512m -Xmn256m"
    ports:
      - "${ROCKETMQ_BROKER_PORT:-10911}:10911"
      - "${ROCKETMQ_PROXY_PORT:-8081}:8081"
    volumes:
      - aihub-rocketmq-data:/home/rocketmq/store

volumes:
  aihub-mysql-data:
  aihub-redis-data:
  aihub-minio-data:
  aihub-nacos-data:
  aihub-es-data:
  aihub-rocketmq-data:
